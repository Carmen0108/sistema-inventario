# Fase DEPLOY: descarga una versión publicada en Releases y la instala en el servidor
name: Despliegue del Sistema de Inventario

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (tag) a desplegar, ej. v1.0.0'
        required: true
        default: 'v1.0.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Descargar versión liberada
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ env.VERSION }}
          fileName: sistema-inventario-${{ env.VERSION }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar paquete descargado
        run: |
          ls -l sistema-inventario-${VERSION}.zip
          unzip -l sistema-inventario-${VERSION}.zip

      - name: Transferir paquete al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: sistema-inventario-${{ env.VERSION }}.zip
          target: ~/sistema-inventario/

      - name: Instalar y verificar versión en el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: VERSION
          script: |
            set -e
            cd ~/sistema-inventario
            mkdir -p version-${VERSION}
            unzip -o sistema-inventario-${VERSION}.zip -d version-${VERSION}
            ls -R version-${VERSION}
            # Prueba de humo: si falla, NO se cambia la versión activa
            python3 version-${VERSION}/src/main.py --verificar
            # "actual" apunta a la versión en uso (permite regresar rápido)
            ln -sfn version-${VERSION} actual
            echo "Versión activa: $(readlink actual)"
