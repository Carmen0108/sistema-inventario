# Fase TEST: ejecuta automáticamente las pruebas unitarias
name: Pruebas del Sistema de Inventario

on:
  push:
    branches: [ main, 'test/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
